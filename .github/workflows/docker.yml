name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/aspwincode/learning-portal-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/aspwincode/learning-portal-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd /root/learning-portal
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose pull migrator backend app_worker app_scheduler app_delivery_worker web

            # Run migrations first and wait for them to finish
            docker compose up -d migrator
            docker compose wait migrator

            # Bring up all services
            docker compose up -d --no-build

            # Wait for backend to respond (up to 90 seconds)
            echo "Waiting for backend..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
                echo "Backend is up after $((i * 5))s"
                break
              fi
              echo "  attempt $i/18..."
              sleep 5
            done

            # If still not responding — force-restart app containers
            if ! curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend not responding, forcing restart..."
              docker compose restart backend app_worker app_scheduler app_delivery_worker
              sleep 15
              curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1 \
                && echo "Backend recovered after restart." \
                || echo "WARNING: backend still not responding after restart."
            fi

            docker image prune -f
            docker logout ghcr.io
