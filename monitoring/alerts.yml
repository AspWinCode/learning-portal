groups:
  - name: learning_portal_alerts
    interval: 30s
    rules:

      # ===== PERFORMANCE ALERTS =====
      - alert: HighAPILatency
        expr: histogram_quantile(0.99, rate(request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High API latency detected ({{ $value | humanizeDuration }})"
          description: "p99 request latency is {{ $value | humanizeDuration }} (threshold: 1.0s)"

      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} of requests"

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "p95 query time is {{ $value | humanizeDuration }}"

      # ===== DATABASE ALERTS =====
      - alert: HighDatabaseConnections
        expr: db_connections_active > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database connection usage"
          description: "Active connections: {{ $value }}/100"

      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "Database server is not responding"

      # ===== CACHE ALERTS =====
      - alert: LowCacheHitRate
        expr: |
          (rate(cache_hits_total[10m]) / (rate(cache_hits_total[10m]) + rate(cache_misses_total[10m]))) < 0.7
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

      # ===== SECURITY ALERTS =====
      - alert: SuspiciousLoginActivity
        expr: rate(failed_logins_total[10m]) > 0.5
        for: 2m
        labels:
          severity: warning
          component: security
        annotations:
          summary: "Suspicious login activity detected"
          description: "Failed login rate is {{ $value }} per minute"

      - alert: RateLimitHits
        expr: rate(requests_rate_limited_total[5m]) > 0.1
        for: 2m
        labels:
          severity: info
          component: security
        annotations:
          summary: "Rate limit threshold exceeded"
          description: "{{ $value | humanizePercentage }} of requests are being rate limited"

      # ===== SYSTEM ALERTS =====
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 > 1024
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage: {{ $value | humanize }}MB"

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage: {{ $value | humanizePercentage }}"

      # ===== SERVICE HEALTH =====
      - alert: ServiceDown
        expr: up{job="learning-portal-backend"} == 0
        for: 1m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "Learning Portal backend is down"
          description: "Backend service is not responding"

      - alert: HighRequestQueueDepth
        expr: request_queue_depth > 100
        for: 3m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Request queue is building up"
          description: "Queue depth: {{ $value }} requests"
