name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/aspwincode/learning-portal-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/aspwincode/learning-portal-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -eu
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd /root/learning-portal
            # Keep every invocation tied to the one production Compose project,
            # independent of shell or directory environment on the server.
            export COMPOSE_PROJECT_NAME=learning-portal
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            # Для генерации визуалов используем Gemini Image API, а не старую Qwen-модель.
            export AI_TUNNEL_MODEL_IMAGE=gemini-3.1-flash-lite-image
            docker compose pull migrator backend app_worker app_scheduler app_delivery_worker web

            # This is a one-shot task. `up` leaves a stopped migrator container
            # in the project; starting the full stack afterwards can race its
            # recreate and leave duplicate/hash-prefixed service containers.
            docker compose run --rm --no-deps migrator

            # Stop and remove app containers in a separate completed step so
            # Compose never races old and replacement containers for the same
            # service names. Named data volumes are not removed.
            docker compose stop backend app_worker app_scheduler app_delivery_worker web
            docker compose rm -f backend app_worker app_scheduler app_delivery_worker web

            # Bring up all services
            docker compose up -d --no-build

            # Wait for backend to respond (up to 90 seconds)
            echo "Waiting for backend..."
            backend_ready=0
            for i in $(seq 1 18); do
              if docker compose exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')" > /dev/null 2>&1; then
                echo "Backend is up after $((i * 5))s"
                backend_ready=1
                break
              fi
              echo "  attempt $i/18..."
              sleep 5
            done

            if [ "$backend_ready" -ne 1 ]; then
              echo "ERROR: backend health check did not pass. Current services:"
              docker compose ps
              docker compose logs --tail=100 backend
              exit 1
            fi

            # A healthy endpoint can still belong to the previous container.
            # Compare running container image IDs with the images just pulled.
            expected_backend_image=$(docker image inspect ghcr.io/aspwincode/learning-portal-backend:latest --format '{{.Id}}')
            backend_container=$(docker compose ps -q backend)
            if [ -z "$backend_container" ]; then
              echo "ERROR: Compose has no backend container after deployment."
              docker compose ps
              exit 1
            fi
            running_backend_image=$(docker inspect --format '{{.Image}}' "$backend_container")
            if [ "$running_backend_image" != "$expected_backend_image" ]; then
              echo "ERROR: the running backend is not using the image pulled in this deployment."
              echo "Expected: $expected_backend_image"
              echo "Running:  $running_backend_image"
              exit 1
            fi

            expected_frontend_image=$(docker image inspect ghcr.io/aspwincode/learning-portal-frontend:latest --format '{{.Id}}')
            frontend_container=$(docker compose ps -q web)
            if [ -z "$frontend_container" ]; then
              echo "ERROR: Compose has no frontend container after deployment."
              docker compose ps
              exit 1
            fi
            running_frontend_image=$(docker inspect --format '{{.Image}}' "$frontend_container")
            if [ "$running_frontend_image" != "$expected_frontend_image" ]; then
              echo "ERROR: the running frontend is not using the image pulled in this deployment."
              echo "Expected: $expected_frontend_image"
              echo "Running:  $running_frontend_image"
              exit 1
            fi
            echo "Verified backend and frontend are running the newly pulled images."

            docker image prune -f
            docker logout ghcr.io
