services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning_portal
      POSTGRES_USER: learning_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_user -d learning_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # для проверки с сервера: curl http://localhost:8000/api/auth/me
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change_me_min_32_chars_change_me_min_32_chars}
      DATABASE_URL: postgresql://learning_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/learning_portal
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com}
      # Telegram (optional)
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      # Точка Банк (выписки, привязка платежей; TOCHKA_ACCOUNT_ID — для автозачисления раз в 10 мин)
      TOCHKA_CLIENT_ID: ${TOCHKA_CLIENT_ID:-}
      TOCHKA_CLIENT_SECRET: ${TOCHKA_CLIENT_SECRET:-}
      TOCHKA_ACCOUNT_ID: ${TOCHKA_ACCOUNT_ID:-}
      # SMS Gateway: InfiniReach (SMS_GATEWAY_PROVIDER=infinireach) или другой (generic)
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      SMS_GATEWAY_PROVIDER: ${SMS_GATEWAY_PROVIDER:-}
      SMS_GATEWAY_FROM: ${SMS_GATEWAY_FROM:-}
      SMS_GATEWAY_DEVICE_ID: ${SMS_GATEWAY_DEVICE_ID:-}
      SMS_GATEWAY_SEND_PATH: ${SMS_GATEWAY_SEND_PATH:-3rdparty/v1/messages}
      # MAX мессенджер: бот (официальный API) и/или личный аккаунт (api-messenger.com)
      MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api.max.ru}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_PERSONAL_BASE_URL: ${MAX_PERSONAL_BASE_URL:-https://app.api-messenger.com/max-v1}
      MAX_PERSONAL_TOKEN: ${MAX_PERSONAL_TOKEN:-}
      # GREEN-API (бесплатный тариф MAX Developer): console.green-api.com
      GREEN_API_BASE_URL: ${GREEN_API_BASE_URL:-}
      GREEN_API_ID_INSTANCE: ${GREEN_API_ID_INSTANCE:-}
      GREEN_API_TOKEN: ${GREEN_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://learning_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/learning_portal
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "telegram_bot_polling.py"]
    restart: unless-stopped
    profiles: ["telegram"]

  web:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    external: true
    name: learning-portal_db_data
  caddy_data:
  caddy_config:


