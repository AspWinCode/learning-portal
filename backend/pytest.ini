[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    requires_db: integration test that needs a real database (set DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
