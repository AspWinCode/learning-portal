global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "learning-portal-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["db:5432"]

