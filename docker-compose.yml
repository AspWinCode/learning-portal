x-app-common-env: &app_common_env
  APP_ENV: production
  REDIS_URL: redis://redis:6379/0
  CACHE_REDIS_URL: redis://redis:6379/1
  DATABASE_URL: postgresql://learning_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/learning_portal
  SECRET_KEY: ${SECRET_KEY:-change_me_min_32_chars_change_me_min_32_chars}
  TOCHKA_CLIENT_ID: ${TOCHKA_CLIENT_ID:-}
  TOCHKA_CLIENT_SECRET: ${TOCHKA_CLIENT_SECRET:-}
  TOCHKA_ACCOUNT_ID: ${TOCHKA_ACCOUNT_ID:-}
  SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
  SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
  SMS_GATEWAY_PROVIDER: ${SMS_GATEWAY_PROVIDER:-}
  SMS_GATEWAY_FROM: ${SMS_GATEWAY_FROM:-}
  SMS_GATEWAY_DEVICE_ID: ${SMS_GATEWAY_DEVICE_ID:-}
  SMS_GATEWAY_SEND_PATH: ${SMS_GATEWAY_SEND_PATH:-3rdparty/v1/messages}
  MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api.max.ru}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  MAX_PERSONAL_BASE_URL: ${MAX_PERSONAL_BASE_URL:-https://app.api-messenger.com/max-v1}
  MAX_PERSONAL_TOKEN: ${MAX_PERSONAL_TOKEN:-}
  GREEN_API_BASE_URL: ${GREEN_API_BASE_URL:-}
  GREEN_API_ID_INSTANCE: ${GREEN_API_ID_INSTANCE:-}
  GREEN_API_TOKEN: ${GREEN_API_TOKEN:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  FROM_EMAIL: ${FROM_EMAIL:-}
  SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-1}
  OWNER_WORKSPACE_EMAIL_DISPATCH_ENABLED: ${OWNER_WORKSPACE_EMAIL_DISPATCH_ENABLED:-1}
  OWNER_WORKSPACE_WEB_PUSH_DISPATCH_ENABLED: ${OWNER_WORKSPACE_WEB_PUSH_DISPATCH_ENABLED:-1}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
  DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  APP_RELEASE: ${APP_RELEASE:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learning_portal
      POSTGRES_USER: learning_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_user -d learning_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app_common_env
      APP_ENV: production
      DATABASE_URL: postgresql://learning_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/learning_portal
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # для проверки с сервера: curl http://localhost:8000/api/auth/me
    environment:
      <<: *app_common_env
      IN_PROCESS_SCHEDULER_ENABLED: "0"
      OWNER_WORKSPACE_DELIVERY_IN_APP: "0"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      # Импорт max_messages → owner workspace раз в 30 мин (телефон контакта). По умолчанию выкл.
      # OWNER_WORKSPACE_AUTO_SYNC_MAX: "1"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://example.com}
      # Telegram (optional)
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      # Точка Банк (выписки, привязка платежей; TOCHKA_ACCOUNT_ID — для автозачисления раз в 10 мин)
      # SMS Gateway: InfiniReach (SMS_GATEWAY_PROVIDER=infinireach) или другой (generic)
      # MAX мессенджер: бот (официальный API) и/или личный аккаунт (api-messenger.com)
      # GREEN-API (бесплатный тариф MAX Developer): console.green-api.com
      METRICS_ENABLED: ${METRICS_ENABLED:-1}
      DISK_STORAGE_ROOT: ${DISK_STORAGE_ROOT:-/app/storage/disk}
    volumes:
      - disk_storage:/app/storage
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app_common_env
      IN_PROCESS_SCHEDULER_ENABLED: "0"
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "dramatiq", "app.background_tasks", "--processes", "1", "--threads", "8"]
    restart: unless-stopped

  app_scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app_common_env
      IN_PROCESS_SCHEDULER_ENABLED: "0"
      OWNER_WORKSPACE_AUTO_SYNC_MAX: ${OWNER_WORKSPACE_AUTO_SYNC_MAX:-0}
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.background_scheduler"]
    restart: unless-stopped

  telegram_bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://learning_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/learning_portal
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    command: ["python", "telegram_bot_polling.py"]
    restart: unless-stopped
    profiles: ["telegram"]

  web:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      # Только localhost — nginx проксирует снаружи, SSL на nginx
      - "127.0.0.1:8090:80"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - backend
      - alertmanager
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    profiles: ["observability"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        sed "s|\$${SLACK_WEBHOOK_URL}|\$${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/WEBHOOK/URL}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/YOUR/WEBHOOK/URL}
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    profiles: ["observability"]

volumes:
  db_data:
    external: true
    name: learning-portal_db_data
  redis_data:
  caddy_data:
  caddy_config:
  grafana_data:
  disk_storage:
